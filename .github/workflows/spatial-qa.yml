name: Casino Anomaly Spatial QA

on:
  push:
    branches: [fix/spatial-qa-11]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify all pinned original Poly Haven assets
        run: |
          set -euo pipefail
          python3 tools/ensure_assets.py
          python3 tools/import_model_assets.py
      - name: Install pinned Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
      - name: Import and verify room geometry, collisions and placements
        shell: bash
        run: |
          set -euo pipefail
          engine=/tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
          "$engine" --headless --path . --editor --import 2>&1 | tee /tmp/spatial-import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' /tmp/spatial-import.log; then exit 1; fi
          "$engine" --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/spatial-smoke.log
          grep -q 'Casino Anomaly scenes and PBR floor smoke PASS' /tmp/spatial-smoke.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' /tmp/spatial-smoke.log; then exit 1; fi
          "$engine" --headless --path . --script res://tests/spatial_qa.gd 2>&1 | tee /tmp/spatial-qa.log
          grep -q 'Casino Anomaly spatial QA PASS' /tmp/spatial-qa.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' /tmp/spatial-qa.log; then exit 1; fi
