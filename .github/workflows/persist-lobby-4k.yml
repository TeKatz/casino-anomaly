name: Persist verified lobby 4K maps on dev
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/persist-lobby-4k.yml'
permissions:
  contents: write
  actions: write
jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify exact user-provided maps
        run: |
          python3 tools/ensure_assets.py
          python3 tools/ensure_hall_textures.py
      - name: Persist only approved source JPEGs on dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/dev | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/plaster002/*.jpg assets/travertine005/*.jpg assets/stone_wall_03/*.jpg
          if git diff --cached --quiet; then
            echo "All approved maps are already tracked."
          else
            git commit -m "Persist nine verified original 4K lobby PBR maps"
            git push origin HEAD:refs/heads/dev
          fi
          # Pushes with GITHUB_TOKEN do not trigger normal push workflows.
          # Explicitly run the existing release workflow for the final dev HEAD.
          gh workflow run development-release.yml --ref dev -f publish=true
