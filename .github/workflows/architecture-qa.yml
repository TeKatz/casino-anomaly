name: Casino Anomaly Architecture / Roulette QA

on:
  push:
    branches: [feature/lounge-fabric-roulette-bar]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scene-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Import original CC0 PBR maps and validate all existing model packages
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ensure_assets.py
          python3 tools/ensure_fabric037.py
          python3 tools/import_model_assets.py
          python3 tools/unpack_sketchfab_assets.py --require-all
      - name: Install Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
      - name: Import scene and test walls, ceiling, raised slot and roulette
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          "$GODOT" --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' /tmp/import.log; then exit 1; fi
          "$GODOT" --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/smoke.log
          grep -q 'Casino Anomaly scenes and PBR floor smoke PASS' /tmp/smoke.log
          "$GODOT" --headless --path . --script res://tests/sketchfab_smoke.gd 2>&1 | tee /tmp/sketchfab.log
          grep -q 'Casino Anomaly Sketchfab model smoke PASS' /tmp/sketchfab.log
          "$GODOT" --headless --path . --script res://tests/spatial_qa.gd 2>&1 | tee /tmp/spatial.log
          grep -q 'Casino Anomaly spatial QA PASS' /tmp/spatial.log
          "$GODOT" --headless --path . --script res://tests/architecture_qa.gd 2>&1 | tee /tmp/finishes.log
          grep -q 'Casino Anomaly architectural PBR finishes PASS' /tmp/finishes.log
          if grep -Eh 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' /tmp/smoke.log /tmp/sketchfab.log /tmp/spatial.log /tmp/finishes.log; then exit 1; fi
