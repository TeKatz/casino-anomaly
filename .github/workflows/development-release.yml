name: Casino Anomaly CI and Development Release

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Run historical editor and standalone layout checks
        type: boolean
        default: false
      publish:
        description: Publish a new Development build (dev only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare-godot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Restore pinned Godot download cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: /tmp/godot-package/godot.zip
          key: godot-linux-x86_64-4.5.1-stable-archive-v1
      - name: Download Godot once on cache miss
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot-package
          timeout --kill-after=5s 150s curl --fail --location --retry 2 --retry-max-time 100 --connect-timeout 15 --max-time 90 -o /tmp/godot-package/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
      - name: Verify archive and engine version
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq /tmp/godot-package/godot.zip
          mkdir -p /tmp/godot-verify
          unzip -q /tmp/godot-package/godot.zip -d /tmp/godot-verify
          engine=/tmp/godot-verify/Godot_v4.5.1-stable_linux.x86_64
          chmod +x "$engine"
          timeout 15s "$engine" --version | grep -E '^4\.5\.1\.stable\.official'
      - uses: actions/upload-artifact@v4
        with:
          name: godot-linux-4.5.1
          path: /tmp/godot-package/godot.zip
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  linux-qa:
    needs: prepare-godot
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [baseline, flood, other_side, silent_audience, gameplay, intro-audio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-linux-4.5.1
          path: /tmp/godot-package
      - name: Restore pinned assets and install shared Godot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ensure_assets.py
          python3 tools/ensure_fabric037.py
          python3 tools/import_model_assets.py
          python3 tools/unpack_sketchfab_assets.py --require-all
          python3 tools/import_croupier_asset.py
          python3 tools/import_tutorial_sketchfab.py
          python3 tools/import_audio.py
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot-package/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-logs
          timeout --kill-after=10s 5m /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee qa-logs/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' qa-logs/import.log; then exit 1; fi
      - name: Run every test in group independently
        env:
          QA_GROUP: ${{ matrix.group }}
        run: python3 tools/run_qa_group.py /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 "$QA_GROUP" --logs qa-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-logs-linux-${{ matrix.group }}
          path: qa-logs/
          retention-days: 7

  python-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test Python tools and QA catalog
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  editor-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
    needs: prepare-godot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-linux-4.5.1
          path: /tmp/godot-package
      - name: Restore assets and import
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ensure_assets.py
          python3 tools/ensure_fabric037.py
          python3 tools/import_model_assets.py
          python3 tools/unpack_sketchfab_assets.py --require-all
          python3 tools/import_croupier_asset.py
          python3 tools/import_tutorial_sketchfab.py
          python3 tools/import_audio.py
          unzip -q /tmp/godot-package/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
          mkdir -p qa-logs
          timeout --kill-after=10s 5m /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee qa-logs/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' qa-logs/import.log; then exit 1; fi
      - name: Run legacy editor placement diagnostics
        run: python3 tools/run_qa_group.py /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 editor-diagnostics --logs qa-logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-logs-editor-diagnostics
          path: qa-logs/

  backrooms-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
    needs: prepare-godot
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-linux-4.5.1
          path: ${{ runner.temp }}
      - name: Install shared Godot
        run: |
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: Import and validate standalone scene in isolation
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/backrooms-project"
          mkdir -p "$WORK/models/backrooms/oxygen" "$WORK/tests" "$WORK/tools" "$WORK/addons/casino_model_preview"
          cp tools/bake_backrooms_voxel_gi.gd "$WORK/tools/"
          cp addons/casino_model_preview/voxel_bake_targets.gd "$WORK/addons/casino_model_preview/"
          cp -r backrooms "$WORK/"
          cp -r models/backrooms/oxygen/textures "$WORK/models/backrooms/oxygen/"
          cp tests/backrooms_layout_qa.gd "$WORK/tests/"
          printf 'config_version=5\n[application]\nconfig/name="Backrooms layout QA"\n[rendering]\nrenderer/rendering_method="forward_plus"\n' > "$WORK/project.godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
          timeout --kill-after=10s 180s "$GODOT" --headless --path "$WORK" --editor --import 2>&1 | tee "$RUNNER_TEMP/backrooms-import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' "$RUNNER_TEMP/backrooms-import.log"; then exit 1; fi
          timeout --kill-after=10s 90s "$GODOT" --headless --path "$WORK" --script res://tests/backrooms_layout_qa.gd 2>&1 | tee "$RUNNER_TEMP/backrooms-qa.log"
          grep -F 'Backrooms sketch 02 native layout QA PASS' "$RUNNER_TEMP/backrooms-qa.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' "$RUNNER_TEMP/backrooms-qa.log"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-logs-backrooms-diagnostics
          path: |
            ${{ runner.temp }}/backrooms-import.log
            ${{ runner.temp }}/backrooms-qa.log

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_commit: ${{ steps.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import verified Poly Haven textures and 3D model dependencies
        shell: pwsh
        run: |
          python tools/ensure_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Source textures unavailable or invalid' }
          python tools/ensure_fabric037.py
          if ($LASTEXITCODE -ne 0) { throw 'ambientCG Fabric037 source unavailable or invalid' }
          python tools/import_model_assets.py
          if ($LASTEXITCODE -ne 0) { throw '3D model dependencies unavailable or invalid' }
          python tools/unpack_sketchfab_assets.py --require-all
          if ($LASTEXITCODE -ne 0) { throw 'Sketchfab CC-BY 4.0 models unavailable or invalid' }
          python tools/import_croupier_asset.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CC-BY-4.0 croupier archive unavailable or invalid' }
          python tools/import_tutorial_sketchfab.py
          if ($LASTEXITCODE -ne 0) { throw 'Optional Sketchfab tutorial props import failed' }
          python tools/import_audio.py
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Casino Anomaly seamless audio archive unavailable or invalid' }
          "PUBLISHED_COMMIT=$env:GITHUB_SHA" >> $env:GITHUB_ENV

      - name: Read-only render asset audit
        shell: pwsh
        run: |
          python tools/audit_render_assets.py > render-asset-audit.json
          if ($LASTEXITCODE -ne 0) { throw 'Render asset audit failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: render-asset-audit
          path: render-asset-audit.json

      - name: Validate persisted signature bottle meshes (read-only)
        shell: pwsh
        run: |
          python tools/repair_signature_bottles.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Signature scene needs an explicit maintenance migration; CI never rewrites main.tscn' }

      - name: Embed version
        id: version
        shell: pwsh
        run: |
          python tools/write_version.py
          if ($LASTEXITCODE -ne 0) { throw 'Version generation failed' }
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "source_commit=$env:PUBLISHED_COMMIT" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile updater and run contract tests
        shell: pwsh
        run: |
          dotnet publish src/CasinoAnomaly.Updater/CasinoAnomaly.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -o artifacts/updater
          if ($LASTEXITCODE -ne 0) { throw 'Updater compilation failed' }
          & ./artifacts/updater/CasinoAnomaly.Updater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Updater contract failed' }

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Roaming/Godot/export_templates/4.5.1.stable
          key: anomaly-godot-4.5.1-win-x64-v1

      - name: Install pinned Godot 4.5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable'
          $work = Join-Path $env:RUNNER_TEMP 'casino-anomaly-godot'
          $editorDir = Join-Path $work 'editor'
          New-Item -ItemType Directory -Force $editorDir | Out-Null
          $archive = Join-Path $work 'editor.zip'
          Invoke-WebRequest "$base/Godot_v4.5.1-stable_win64.exe.zip" -OutFile $archive
          Expand-Archive $archive $editorDir -Force
          $editor = Join-Path $editorDir 'Godot_v4.5.1-stable_win64_console.exe'
          if (!(Test-Path $editor)) { throw 'Godot executable missing' }
          "GODOT_EDITOR=$editor" >> $env:GITHUB_ENV
          $templates = Join-Path $env:APPDATA 'Godot/export_templates/4.5.1.stable'
          $template = Join-Path $templates 'windows_release_x86_64.exe'
          New-Item -ItemType Directory -Force $templates | Out-Null
          if (!(Test-Path $template)) {
            $archivePath = Join-Path $work 'templates.tpz'
            Invoke-WebRequest "$base/Godot_v4.5.1-stable_export_templates.tpz" -OutFile $archivePath
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
            try {
              $entry = $zip.GetEntry('templates/windows_release_x86_64.exe')
              if ($null -eq $entry) { throw 'Godot Windows template missing' }
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $template, $true)
            } finally { $zip.Dispose() }
          }

      - name: Import Windows project
        id: windows-import
        shell: pwsh
        run: |
          # Verify committed rendering intent BEFORE headless editor import,
          # which may normalize GPU-only rendering settings on CI runners.
          $renderCfg = Get-Content project.godot -Raw
          foreach ($flag in @('anti_aliasing/quality/use_taa=true', 'textures/default_filters/anisotropic_filtering_level=3')) {
            if (-not $renderCfg.Contains($flag)) { throw "Required rendering flag missing: $flag" }
          }
          & "$env:GODOT_EDITOR" --headless --path . --editor --import 2>&1 | Tee-Object -FilePath import.log
          if ($LASTEXITCODE -ne 0 -or (Get-Content import.log -Raw) -match '(?m)(SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:)') { throw 'Godot import failed' }
          $decorSource = Get-Content gameplay/tutorial_decor.tscn -Raw
          if ($decorSource.Contains('script = ExtResource("user_selected")')) {
            throw 'Tutorial decor needs explicit editor bake; CI does not rewrite authored scenes'
          }

      - name: Run Windows QA without fail-fast
        shell: pwsh
        run: |
          python tools/run_qa_group.py "$env:GODOT_EDITOR" windows --logs qa-logs
          if ($LASTEXITCODE -ne 0) { throw 'One or more Windows tests failed; see full QA summary' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-logs-windows
          path: |
            import.log
            qa-logs/
          retention-days: 7

      - name: Export Windows game
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/game | Out-Null
          $exe = Join-Path (Get-Location) 'artifacts/game/CasinoAnomaly.exe'
          & "$env:GODOT_EDITOR" --headless --path . --export-release 'Windows Desktop' $exe 2>&1 | Tee-Object -FilePath export.log
          if ($LASTEXITCODE -ne 0 -or (Get-Content export.log -Raw) -match '(?m)(SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:)') { throw 'Godot export failed' }
          if (!(Test-Path artifacts/game/CasinoAnomaly.exe) -or !(Test-Path artifacts/game/CasinoAnomaly.pck)) { throw 'Missing exported game' }
          if (-not (Test-Path branding/casino_anomaly.svg)) { throw 'Custom Casino Anomaly icon source missing' }
          if (-not (Select-String -Path export_presets.cfg -SimpleMatch 'application/icon="res://branding/casino_anomaly.svg"' -Quiet)) { throw 'Windows export preset must include the custom icon' }

      - name: Package standalone game and manifest
        shell: pwsh
        run: |
          $bundle = 'artifacts/package'
          New-Item -ItemType Directory -Force "$bundle/tools/updater" | Out-Null
          Copy-Item artifacts/game/CasinoAnomaly.exe $bundle
          Copy-Item artifacts/game/CasinoAnomaly.pck $bundle
          Copy-Item artifacts/updater/CasinoAnomaly.Updater.exe "$bundle/tools/updater/"
          Copy-Item version.json $bundle
          Copy-Item ASSET_CREDITS.md $bundle
          Copy-Item third_party/GODOT-LICENSE.txt $bundle
          Copy-Item third_party/GODOT-COPYRIGHT.txt $bundle
          'ZIP vollstaendig entpacken und CasinoAnomaly.exe starten. Im Hauptmenue koennen Updates installiert werden.' | Set-Content "$bundle/START-HIER.txt" -Encoding utf8
          $package = 'artifacts/casino-anomaly-win-x64.zip'
          Compress-Archive -Path "$bundle/*" -DestinationPath $package -CompressionLevel Optimal
          $hash = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $package).Length
          if ($size -lt 1000000) { throw 'Package suspiciously small' }
          $manifest = [ordered]@{
            schemaVersion = 1
            version = $env:VERSION
            versionCode = [int]$env:GITHUB_RUN_NUMBER
            channel = 'development'
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            sourceCommit = $env:PUBLISHED_COMMIT
            package = [ordered]@{
              url = "https://github.com/TeKatz/casino-anomaly/releases/download/development/casino-anomaly-win-x64.zip?revision=$env:VERSION"
              sha256 = $hash
              sizeBytes = $size
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content artifacts/update-manifest.json -Encoding utf8NoBOM
          "$hash  casino-anomaly-win-x64.zip" | Set-Content artifacts/casino-anomaly-win-x64.zip.sha256 -Encoding ascii
          "Independent Casino Anomaly Development $env:VERSION" | Set-Content artifacts/release-notes.md -Encoding utf8

      # Keep a downloadable standalone ZIP even when repository policy
      # prevents the GitHub Actions token from creating a Release.
      - name: Preserve downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: casino-anomaly-win-x64
          path: |
            artifacts/casino-anomaly-win-x64.zip
            artifacts/casino-anomaly-win-x64.zip.sha256
            artifacts/update-manifest.json
            artifacts/release-notes.md
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [python-qa, linux-qa, windows-build]
    if: github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: casino-anomaly-development
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.windows-build.outputs.version }}
      PUBLISHED_COMMIT: ${{ needs.windows-build.outputs.source_commit }}
    steps:
      - name: Skip outdated build rather than overwrite newer releases
        id: freshness
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/dev" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify current dev head' }
          if ($head.Trim() -ne $env:PUBLISHED_COMMIT) {
            "current=false" >> $env:GITHUB_OUTPUT
            Write-Host 'A newer dev commit exists; skipping publication of this older build.'
          } else {
            "current=true" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/download-artifact@v4
        if: steps.freshness.outputs.current == 'true'
        with:
          name: casino-anomaly-win-x64
          path: artifacts

      - name: Publish independent Development release
        id: publish_release
        # A restricted GitHub App installation can return HTTP 403 for
        # release edits. This must not invalidate a tested, uploaded build.
        # The artifact remains available, with a prominent warning below.
        if: steps.freshness.outputs.current == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CASINO_RELEASE_TOKEN || github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Publish the large archive FIRST. A new manifest must never
          # advertise a version while GitHub still returns 404 for its ZIP.
          $package = 'artifacts/casino-anomaly-win-x64.zip'
          $checksum = 'artifacts/casino-anomaly-win-x64.zip.sha256'
          $manifest = 'artifacts/update-manifest.json'
          gh release view development --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload development --repo "$env:GITHUB_REPOSITORY" --clobber $package
            if ($LASTEXITCODE -ne 0) { throw 'Could not upload the Development ZIP' }
          } else {
            gh release create development --repo "$env:GITHUB_REPOSITORY" --target "$env:PUBLISHED_COMMIT" --prerelease --title "Casino Anomaly Development $env:VERSION" --notes-file artifacts/release-notes.md $package
            if ($LASTEXITCODE -ne 0) { throw 'Could not create Development release: check CASINO_RELEASE_TOKEN' }
          }

          # The GitHub API can already list a new asset while the public
          # browser download is still missing. Check the exact anonymous URL
          # consumed by installed versions of CasinoAnomaly.Updater.
          $publicPackage = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/development/casino-anomaly-win-x64.zip?revision=$($env:VERSION)"
          $ready = $false
          for ($attempt = 1; $attempt -le 16; $attempt++) {
            try {
              $head = Invoke-WebRequest -Method Head -Uri $publicPackage -MaximumRedirection 10 -TimeoutSec 30 -ErrorAction Stop
              if ([int]$head.StatusCode -ge 200 -and [int]$head.StatusCode -lt 300) {
                $ready = $true
                Write-Host "Development ZIP publicly reachable (HEAD $($head.StatusCode)), attempt $attempt."
                break
              }
            } catch {
              Write-Host "Development ZIP not yet publicly reachable ($attempt/16): $($_.Exception.Message)"
            }
            if ($attempt -lt 16) { Start-Sleep -Seconds 7 }
          }
          if (-not $ready) { throw 'Public Development ZIP is not available; keeping the previous manifest rather than advertising a broken update' }

          # The checksum goes up next, and the manifest goes up LAST.
          # Until this final upload, users never see an announced version
          # whose package does not yet exist.
          gh release upload development --repo "$env:GITHUB_REPOSITORY" --clobber $checksum
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Development checksum' }
          gh release upload development --repo "$env:GITHUB_REPOSITORY" --clobber $manifest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Development manifest' }
          gh release edit development --repo "$env:GITHUB_REPOSITORY" --target "$env:PUBLISHED_COMMIT" --prerelease --title "Casino Anomaly Development $env:VERSION" --notes-file artifacts/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the Development release metadata' }

      - name: Report release permission fallback
        if: failure() && steps.publish_release.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "::warning::Development Release konnte wegen fehlender GitHub-Berechtigung nicht vollstaendig aktualisiert werden. Windows-ZIP, SHA256 und Manifest sind im Workflow-Artefakt verfuegbar. CASINO_RELEASE_TOKEN mit Release-Schreibrechten erforderlich."
          @'
          ### Development Release nicht aktualisiert
          Der Windows-Build und alle Tests waren erfolgreich, aber die GitHub-API
          hat das Veröffentlichen/Bearbeiten des Development-Releases abgelehnt.
          Nutze bis zur Korrektur der Berechtigungen das Workflow-Artefakt
          **casino-anomaly-win-x64** (ZIP, SHA256, Manifest).
          Für automatische Releases benötigt **CASINO_RELEASE_TOKEN** ein
          Token mit Contents-/Release-Schreibzugriff.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Verify public release download
        if: steps.publish_release.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'artifacts/verification'
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download development --repo "$env:GITHUB_REPOSITORY" --dir $dir --pattern 'casino-anomaly-win-x64.zip' --pattern 'casino-anomaly-win-x64.zip.sha256' --pattern 'update-manifest.json'
          if ($LASTEXITCODE -ne 0) { throw 'Published download failed' }
          $manifest = Get-Content "$dir/update-manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.channel -ne 'development' -or $manifest.version -ne $env:VERSION) { throw 'Wrong published version' }
          if ((Get-FileHash "$dir/casino-anomaly-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.package.sha256) { throw 'Published checksum mismatch' }
          if ((Get-Item "$dir/casino-anomaly-win-x64.zip").Length -ne $manifest.package.sizeBytes) { throw 'Published size mismatch' }
          Write-Host "Verified published Casino Anomaly $env:VERSION"
