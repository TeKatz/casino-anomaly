name: Casino Anomaly Major Events QA

on:
  push:
    branches: [dev]
    paths:
      - 'gameplay/anomalies/silent_audience*'
      - 'gameplay/anomaly_definitions/the_silent_audience.tres'
      - 'tests/anomaly_variations_qa.gd'
      - 'tests/silent_audience_actor_qa.gd'
      - 'tools/run_godot_qa.py'
      - 'tests/test_run_godot_qa.py'
      - '.github/workflows/major-events-qa.yml'
  pull_request:
    paths:
      - 'gameplay/anomalies/silent_audience*'
      - 'gameplay/anomaly_definitions/the_silent_audience.tres'
      - 'tests/anomaly_variations_qa.gd'
      - 'tests/silent_audience_actor_qa.gd'
      - 'tools/run_godot_qa.py'
      - 'tests/test_run_godot_qa.py'
      - '.github/workflows/major-events-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anomalies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [baseline, flood, other_side, silent_audience, actor]
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified geometry and animation source assets
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ensure_assets.py
          python3 tools/ensure_fabric037.py
          python3 tools/import_model_assets.py
          python3 tools/unpack_sketchfab_assets.py --require-all
          python3 tools/import_croupier_asset.py
      - name: Install Godot 4.5.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
      - name: Parse and import all new scene and shader resources
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
          timeout --kill-after=10s 5m "$GODOT" --headless --path . --editor --import 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:' /tmp/import.log; then cat /tmp/import.log; exit 1; fi
      - name: Run isolated QA suite
        shell: bash
        env:
          QA_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          GODOT=/tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
          python3 -m unittest discover -s tests -p test_run_godot_qa.py
          case "$QA_SUITE" in
            actor)
              python3 tools/run_godot_qa.py "$GODOT" tests/silent_audience_actor_qa.gd 'Casino Anomaly silent audience actor QA PASS' --log /tmp/qa.log ;;
            baseline)
              python3 tools/run_godot_qa.py "$GODOT" tests/anomaly_variations_qa.gd 'Casino Anomaly ten subtle anomalies QA PASS' --suite baseline --log /tmp/qa.log ;;
            *)
              python3 tools/run_godot_qa.py "$GODOT" tests/anomaly_variations_qa.gd "Casino Anomaly major event QA PASS: $QA_SUITE" --suite "$QA_SUITE" --log /tmp/qa.log ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-logs-${{ matrix.suite }}
          path: |
            /tmp/import.log
            /tmp/qa.log
