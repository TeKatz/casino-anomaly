name: Validate Poly Haven Interior Models

on:
  push:
    branches: [feature/polyhaven-interior-models]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and pin Poly Haven original 1K glTF models
        run: |
          set -euo pipefail
          python3 tools/import_model_assets.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- models/
          if ! git diff --cached --quiet; then
            git commit -m "assets: import all ten Poly Haven CC0 models with pinned hashes"
            git push origin HEAD:refs/heads/feature/polyhaven-interior-models
          fi
      - name: Check Godot 4.5.1 can import entire scene
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import 2>&1 | tee /tmp/model-import.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:" /tmp/model-import.log; then exit 1; fi
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/model-smoke.log
          grep -q "Casino Anomaly scenes and PBR floor smoke PASS" /tmp/model-smoke.log
          if grep -Eq "SCRIPT ERROR:|Parse Error:|Failed to load|^ERROR:" /tmp/model-smoke.log; then exit 1; fi
          echo "All ten CC0 Poly Haven 3D models imported and placed successfully"
