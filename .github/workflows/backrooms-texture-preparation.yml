name: Prepare Backrooms clean textures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract source atlas regions
        run: |
          python -m pip install Pillow==11.3.0
          python tools/prepare_backrooms_textures.py
      - name: Persist only the derived textures
        run: |
          git add models/backrooms/oxygen/textures
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets: extract clean Oxygen wall floor and ceiling textures"
          git push origin HEAD:dev
